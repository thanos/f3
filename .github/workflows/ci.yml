# Required jobs must pass. Jobs whose names start with "informational" may
# fail (continue-on-error) and do not gate the branch.
#
# informational-native repeats the native suite and does not gate the branch.
# The NIF selects nightly-2025-11-15. The writer helper selects
# nightly-2025-02-24. The required decode job installs both and runs
# `mix test --only native`. The rust-free suite expects no NIF.
# informational-fixtures regenerates fixtures from upstream and runs only on
# workflow_dispatch. Required jobs check the committed manifest. They do not
# clone Vortex or Lance.
#
# OTP is pinned to 28.3.1. A bare "28" installs the newest 28.x, and the
# macOS asset for OTP-28.5.0.8 returns HTTP 504. 28.3.1 is still NIF 2.17.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "28.3.1"
      - run: mix deps.get
      - run: mix ci

  decode:
    name: decode (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "28.3.1"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-15
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-02-24
      - run: mix deps.get
        env:
          F3_BUILD_NATIVE: "1"
      - run: mix compile --force --warnings-as-errors
        env:
          F3_BUILD_NATIVE: "1"
      - run: mix test --only native
        env:
          F3_BUILD_NATIVE: "1"

  informational-native:
    name: informational native (${{ matrix.os }})
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "28.3.1"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-11-15
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-02-24
      - run: mix deps.get
        env:
          F3_BUILD_NATIVE: "1"
      - run: mix compile --warnings-as-errors
        env:
          F3_BUILD_NATIVE: "1"
      - run: mix test --only native
        env:
          F3_BUILD_NATIVE: "1"

  informational-fixtures:
    name: informational fixture regeneration
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-02-24
          targets: wasm32-wasip1
      - run: scripts/fixtures/generate.sh
